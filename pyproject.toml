[project]
name = "vmdk-shrink"
version = "0.1.0"
description = "Losslessly shrink or compact VMware ext4 VMDKs from a Windows host using a headless Linux helper VM"
readme = "README.md"
authors = [
    { name = "Mersid", email = "mersid_email@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "paramiko>=5.0.0",
    "pycdlib>=1.21.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "vncdotool>=1.4.2",
]

[project.scripts]
vmdk = "vmdk_shrink.cli:app"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-paramiko>=5.0.0.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative style requires function calls in parameter defaults
"src/vmdk_shrink/cli.py" = ["B008"]
# Windows env var is case-sensitive by name
"src/vmdk_shrink/paths.py" = ["SIM112"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "vncdotool.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
